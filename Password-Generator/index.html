<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <title>Password Generator</title>
  </head>
  <body>
    <div class="card">
        <h2>Generate a</h2>
        <h2 id="subhead">Random Password</h2>
        <p class="support-text">Never use an insecure password again.</p>
        <div class="inner-flex">
            <button class="btn" onclick="fillPassword()">Generate passwords</button>
            <input id="pass-len" type="number" class="pwd-size" placeholder="Enter the password length">
        </div>
        <div class="line"></div>
        <div class="inner-flex">
            <div class="pass-text" id="pwd1"></div>
            <div class="pass-text" id="pwd2"></div>
        </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
