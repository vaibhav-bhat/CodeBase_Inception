<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="headerContainer">
            <h2 class="headerText">Metric / Imperial Unit Conversion</h2>
            <input type="number" class="unitText" id="inputNum" value="0">
            <button class="btn-convert" id="convert-btn">Convert</button>
        </div>
        <div class="bodyContaier">
            <div class="conInfoBoxes">
                <h4 class="convert-title">Length (Meter/Feet)</h4>
                <p class="convert-text" id="c1">0 meters = 0 feet | 0 feet = 0 meters</p>
            </div>
            <div class="conInfoBoxes">
                <h4 class="convert-title">Volume (Liters/Gallons)</h4>
                <p class="convert-text" id="c2">0 liters = 0 gallons | 0 gallons = 0 liters</p>
            </div>
            <div class="conInfoBoxes">
                <h4 class="convert-title">Mass (Kilograms/Pounds)</h4>
                <p class="convert-text" id="c3">0 kilos = 0 pounds | 0 pounds = 0 kilos</p>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
